# Cargo config file.
# See: https://doc.rust-lang.org/cargo/reference/config.html

# Environment variables set for all `cargo ...` commands.
[env]

# Scope down tracing, to filter out external lib tracing.
RUST_LOG="web_server=debug,lib_core=debug,lib_web=debug,lib_auth=debug,lib_utils=debug"

# Selects config/development.toml for local cargo commands.
SERVICE_ENV="development"

# Development database bootstrap URLs. These are used only by debug/dev DB setup.
DEV_POSTGRES_URL="postgres://postgres:dev_only_pwd@localhost:5432/postgres"
DEV_APP_URL="postgres://app_user:dev_only_pwd@localhost:5432/app_db"

# Development-only auth keys. Production must provide these via environment
# variables, a mounted config/local.toml, or a secret manager.
SERVICE_PWD_KEY="CKUGFOD9_2Qf6Pn3ZFRYgPYb8ht4vKqEG9PGMXTB7497bT0367DjoaD6ydFnEVaIRda0kKeBZVCT5Hb62m2sCA"
